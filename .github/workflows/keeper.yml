name: keeper
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate only (1) or send (0)'
        default: '0'
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: packages/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/keeper/package-lock.json
      - run: npm ci
      - name: Keeper pass
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          KEEPER_DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: npx tsx src/cli.ts --once
